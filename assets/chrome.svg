<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="62" viewBox="0 0 1000 62" role="img" aria-label="Window bar: github.com/harshapilli369, available January 2027.">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="31" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="lift" x="-14%" y="-18%" width="128%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#6B5F45" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1000" height="62" fill="#E4DAC6"/>
  <g font-family="Georgia, 'Times New Roman', serif">
  <rect x="10.0" y="10.0" width="980.0" height="42.0" rx="11" fill="#F4EFE3" stroke="#E0D7C4" stroke-width="1" filter="url(#lift)"/>
  <circle cx="34.0" cy="31.0" r="5.5" fill="#C4816A"/>
  <circle cx="52.0" cy="31.0" r="5.5" fill="#D2A857"/>
  <circle cx="70.0" cy="31.0" r="5.5" fill="#7E9B6E"/>
  <rect x="350.0" y="19.0" width="300.0" height="24.0" rx="12" fill="#FDFBF6" stroke="#E0D7C4" stroke-width="1"/>
  <text x="500.0" y="35.0" font-size="10.5" fill="#6B7378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" text-anchor="middle">github.com/harshapilli369</text>
  <circle cx="806.0" cy="31.0" r="4.5" fill="#7E9B6E"/>
  <text x="818.0" y="35.0" font-size="10.5" fill="#3A4348">Available January 2027</text>
  </g>
  <rect width="1000" height="62" filter="url(#grain)"/>
</svg>

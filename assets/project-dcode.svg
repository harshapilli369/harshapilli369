<svg xmlns="http://www.w3.org/2000/svg" width="490" height="226" viewBox="0 0 490 226" role="img" aria-label="DCode. Architecture layers proposed automatically by Leiden and Louvain community detection over dependency graphs. Faculty-supervised research at Dalhousie. dcodehub.com">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="31" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
    <filter id="lift" x="-14%" y="-18%" width="128%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#6B5F45" flood-opacity="0.16"/>
    </filter>
  </defs>

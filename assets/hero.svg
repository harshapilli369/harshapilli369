  <text x="48.0" y="180.0" font-size="13.5" fill="#697176">Java · Spring Boot · REST APIs · Cloud</text>
  <text x="48.0" y="208.0" font-size="12" fill="#394247">Three years of production delivery before the degree, not after it.</text>

  <rect x="10.0" y="10.0" width="216.0" height="34.0" rx="11" fill="#F4EFE3"/>
  <rect x="10.0" y="27.0" width="216.0" height="17.0" rx="0" fill="#F4EFE3"/>
  <line x1="10.0" y1="44.0" x2="226.0" y2="44.0" stroke="#E0D7C4" stroke-width="1"/>
  <rect x="24.0" y="23.5" width="7.0" height="7.0" rx="2" fill="#1155CC"/>

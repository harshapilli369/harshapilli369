      <text x="44" y="628">and Fortify wired into the SDLC, and ten</text>
      <text x="44" y="646">Grafana dashboards that cut issue-</text>
      <text x="44" y="664">detection time by roughly 30%.</text>
      <text x="44" y="694">I like backend systems where the</text>
      <text x="44" y="712">correctness is checkable. Layered</text>
      <text x="44" y="730">services, a real test suite, and a pipeline</text>
      <text x="44" y="748">that will not let a bad build through.</text>

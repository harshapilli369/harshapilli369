<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Harsha Pilli, Java and Spring Boot developer, available for a 4 or 8 month developer co-op from January 2027">
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="11" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.055"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="280" fill="#FBF8F1"/>
  <rect x="0" y="0" width="1000" height="280" filter="url(#grain)"/>
  <rect x="0.5" y="0.5" width="999" height="279" fill="none" stroke="#D8D2C4" stroke-width="1"/>
  <rect x="14.5" y="14.5" width="971" height="251" fill="none" stroke="#E6E0D2" stroke-width="1"/>

  <text x="500" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="46" fill="#12181B" letter-spacing="7">HARSHA PILLI</text>

  <line x1="360" y1="129" x2="640" y2="129" stroke="#C5D0E3" stroke-width="1.4"/>
  <line x1="360" y1="134" x2="640" y2="134" stroke="#C5D0E3" stroke-width="0.6"/>

  <text x="500" y="167" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="13.5" fill="#55636A" letter-spacing="4.2">JAVA · SPRING BOOT · REST APIs · CLOUD</text>

  <text x="500" y="205" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="16" fill="#12181B">Three years of production delivery, now completing a Master of Applied</text>
  <text x="500" y="228" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="16" fill="#12181B">Computer Science at Dalhousie University in Halifax, Nova Scotia.</text>

  <text x="500" y="258" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif"
        font-size="13.5" fill="#1155CC" letter-spacing="1.6">Available for a 4- or 8-month developer co-op from January 2027 · Open to relocation anywhere in Canada</text>
</svg>
